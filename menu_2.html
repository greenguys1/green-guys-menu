<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffeeshop Green Guys — Menukaart</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg-0: #0a201c;
    --bg-1: #0e2b25;
    --panel: #113329;
    --panel-2: #163b30;
    --line: rgba(190, 225, 205, 0.14);
    --mint: #3aa88a;
    --mint-bright: #5fd1ac;
    --gold: #e7c86a;
    --cream: #f1f6f0;
    --muted: #82a894;
    --free: #a8dd6a;
    --shadow: rgba(0,0,0,0.4);

    --c-indica: #7b6bd1;
    --c-indica-2: #5a49b0;
    --c-sativa: #b7cf3f;
    --c-sativa-2: #8fac2c;
    --c-hybrid: #33b7ac;
    --c-hybrid-2: #1f8f86;
    --c-california: #d99a3d;
    --c-california-2: #b97724;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg-0);
    color: var(--cream);
    font-family: 'Manrope', system-ui, sans-serif;
    min-height:100vh;
  }

  .leaf-field{
    position: fixed; inset:0;
    background:
      radial-gradient(120% 140% at 12% -10%, var(--bg-1) 0%, var(--bg-0) 55%, #06120f 100%),
      repeating-linear-gradient(115deg, rgba(95,209,172,0.028) 0px, rgba(95,209,172,0.028) 1px, transparent 1px, transparent 68px),
      repeating-linear-gradient(25deg, rgba(231,200,106,0.02) 0px, rgba(231,200,106,0.02) 1px, transparent 1px, transparent 84px);
    pointer-events:none;
    z-index:0;
  }

  header{
    position:relative; z-index:1;
    text-align:center;
    padding: clamp(28px,4.5vw,52px) 20px clamp(10px,1.8vw,20px);
  }

  .logo-header{
    width: clamp(120px,14vw,190px);
    height: auto;
    margin: 0 auto;
    display: block;
    filter: drop-shadow(0 8px 20px var(--shadow));
  }

  main{
    position:relative; z-index:1;
    max-width: 1360px;
    margin: 0 auto;
    padding: 8px clamp(16px,3vw,40px) 40px;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(24px,2.8vw,40px);
  }
  @media (max-width: 880px){
    main{ grid-template-columns: 1fr; }
  }

  .col{ display:flex; flex-direction:column; gap: clamp(26px,3vw,38px); }

  .category{
    --accent: var(--mint);
    --accent-2: #2f8f74;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 4px 4px 16px 16px;
    overflow:visible;
    box-shadow: 0 16px 34px var(--shadow);
    margin-top: 22px;
  }

  .ribbon-wrap{
    position:relative;
    display:flex; justify-content:center;
    margin-top: -22px;
    padding: 0 8px;
  }
  .ribbon{
    position:relative;
    display:inline-block;
    background: linear-gradient(100deg, var(--accent) 0%, var(--accent-2) 100%);
    color: var(--cream);
    font-family:'Fraunces', serif;
    font-weight:700;
    font-style: normal;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: clamp(17px,1.75vw,22px);
    text-align:center;
    padding: 11px 40px;
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%);
    box-shadow: 0 8px 18px rgba(0,0,0,0.3);
    white-space: nowrap;
  }
  .ribbon::after{
    content: attr(data-sub);
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-style:normal;
    font-weight:500;
    font-size: 9.5px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(241,246,240,0.65);
    margin-top: 1px;
  }

  .rows{ padding: 8px clamp(10px,1.6vw,18px) 12px; }

  table.price-table{
    width:100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  .price-table col.col-thc{ width: 15%; }
  .price-table col.col-name{ width: 33%; }
  .price-table col.col-gram{ width: 10.4%; }

  .price-table thead th{
    font-family:'JetBrains Mono', monospace;
    font-size: clamp(10px,0.95vw,12px);
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    font-weight:700;
    text-align:center;
    padding: 8px 4px 10px;
    border-bottom: 2px solid var(--accent);
    opacity: 0.9;
  }
  .price-table thead th.th-thc,
  .price-table thead th.th-name{ text-align:left; }
  .price-table thead th.th-gram-last{ text-align:right; padding-right: 10px; }

  .price-table tbody td{
    padding: 15px 4px;
    border-bottom: 1px solid var(--line);
    border-left: 1px solid var(--line);
    vertical-align: middle;
  }
  .price-table tbody td:first-child{ border-left:none; }
  .price-table tbody tr:last-child td{ border-bottom:none; }
  .price-table tbody tr:nth-child(even){ background: rgba(255,255,255,0.025); }
  .price-table tbody tr:hover{ background: rgba(255,255,255,0.05); }

  .thc{
    font-family:'JetBrains Mono', monospace;
    font-size: clamp(11px,1vw,13px);
    font-weight:600;
    color: #b9d6c4;
    padding-left: 4px !important;
  }
  .pname{
    font-weight:700;
    font-size: clamp(14px,1.3vw,17px);
    color: var(--cream);
  }
  .pname .star{ color: var(--free); }
  .pname.sold-out .pname-main{
    text-decoration: line-through;
    text-decoration-color: #e05a4e;
    text-decoration-thickness: 2px;
    opacity: 0.55;
  }
  .pname-soldout-tag{
    display:inline-block;
    margin-left: 8px;
    font-family:'JetBrains Mono', monospace;
    font-size: 0.62em;
    font-weight:700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #e05a4e;
    border: 1px solid #e05a4e;
    border-radius: 999px;
    padding: 2px 7px;
    vertical-align: middle;
  }
  .pname-sub{
    display:block;
    font-weight:500;
    font-size: 0.72em;
    letter-spacing: 0.2px;
    color: var(--muted);
    margin-top: 1px;
  }
  .price{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size: clamp(13px,1.15vw,15.5px);
    color: var(--cream);
  }
  .price:last-child{ text-align:right; padding-right: 10px !important; color: var(--gold); }
  .badge-free, .badge-highlight{
    display:inline-block;
    font-weight:800;
    letter-spacing: 0.2px;
    white-space: nowrap;
    border-radius: 999px;
  }
  .badge-free{
    color: var(--bg-0);
    background: linear-gradient(100deg, var(--free) 0%, #8fcf4a 100%);
    font-size: clamp(10.5px,0.9vw,12.5px);
    padding: 5px 11px;
    box-shadow: 0 3px 10px rgba(168,221,106,0.4);
  }
  .badge-highlight{
    color: var(--bg-0);
    background: linear-gradient(100deg, var(--gold) 0%, #d1ad4e 100%);
    font-size: clamp(13px,1.2vw,16px);
    padding: 5px 12px;
    box-shadow: 0 3px 10px rgba(231,200,106,0.45);
  }
  .price.perg{
    text-align:left !important;
    color: var(--gold);
    font-weight:700;
    padding-left: 4px !important;
  }
  .price.perg .unit{
    color: var(--muted);
    font-weight:400;
    font-size: 0.85em;
    margin-left:4px;
  }

  footer{
    position:relative; z-index:1;
    text-align:center;
    padding: 8px 20px 44px;
    font-family:'JetBrains Mono', monospace;
    font-size: clamp(11px,1.1vw,13px);
    letter-spacing: 1px;
    color: var(--gold);
  }
  footer .star{ color: var(--free); }

  /* ============================================================
     BEWERK-PANEEL — knoppen/invoervelden om producten toe te voegen,
     aan te passen of te verwijderen zonder de code aan te raken.
     Wijzigingen worden opgeslagen in de browser (localStorage) van
     dit apparaat. Gebruik Exporteren/Importeren om ze over te zetten
     naar een ander apparaat (bijv. de computer achter het TV-scherm).
     ============================================================ */
  .edit-toggle{
    position: fixed;
    top: 18px; right: 18px;
    z-index: 20;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--cream);
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 8px 20px var(--shadow);
    display:flex; align-items:center; gap:6px;
  }
  .edit-toggle:hover{ border-color: var(--mint-bright); }

  .edit-overlay{
    position:fixed; inset:0;
    background: rgba(6,18,15,0.55);
    z-index: 29;
    display:none;
  }
  body.editing .edit-overlay{ display:block; }

  .edit-panel{
    position:fixed; top:0; right:0; bottom:0;
    width: min(440px, 100vw);
    background: var(--bg-1);
    border-left: 1px solid var(--line);
    z-index: 30;
    overflow-y:auto;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    padding: 20px 18px 60px;
    font-family:'Manrope', sans-serif;
  }
  body.editing .edit-panel{ transform: translateX(0); }

  .edit-panel h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 22px;
    margin: 4px 0 4px;
  }
  .edit-panel .edit-hint{
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    line-height:1.5;
  }
  .edit-toolbar{
    display:flex; gap:8px; flex-wrap:wrap;
    margin-bottom: 18px;
  }
  .edit-toolbar button, .edit-close{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--cream);
    font-size: 12px;
    font-weight:600;
    padding: 7px 12px;
    border-radius: 8px;
    cursor:pointer;
  }
  .edit-toolbar button:hover, .edit-close:hover{ border-color: var(--mint-bright); }
  .edit-toolbar .danger{ color: #ff9a8a; }

  .edit-close{
    position:absolute; top:18px; right:18px;
  }

  .edit-cat-block{
    margin-bottom: 22px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    background: var(--panel);
  }
  .edit-cat-title{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight:600;
    font-size: 16px;
    color: var(--accent-label, var(--mint-bright));
    margin-bottom: 8px;
  }
  .edit-item{
    display:grid;
    grid-template-columns: 1fr;
    gap: 6px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .edit-item:first-of-type{ border-top:none; }
  .edit-item .row2{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .edit-item .row5{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
  }
  .edit-item label{
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    display:block;
    margin-bottom: 2px;
  }
  .edit-item input[type="text"], .edit-item input[type="number"]{
    width:100%;
    background: var(--bg-1);
    border: 1px solid var(--line);
    color: var(--cream);
    border-radius: 6px;
    padding: 6px 7px;
    font-size: 12.5px;
    font-family:'JetBrains Mono', monospace;
  }
  .edit-item .flags{
    display:flex; gap:14px; align-items:center;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .edit-item .flags label{
    display:flex; align-items:center; gap:5px;
    text-transform:none; letter-spacing:0; font-size:11.5px;
  }
  .edit-item .remove-item{
    align-self:flex-end;
    background: none;
    border: 1px solid rgba(255,140,120,0.4);
    color: #ff9a8a;
    font-size: 11px;
    padding: 5px 9px;
    border-radius: 6px;
    cursor:pointer;
    margin-top: 4px;
    width: fit-content;
  }
  .add-item-btn{
    width:100%;
    margin-top: 6px;
    background: none;
    border: 1px dashed var(--line);
    color: var(--mint-bright);
    font-size: 12px;
    font-weight:600;
    padding: 8px;
    border-radius: 8px;
    cursor:pointer;
  }
  .add-item-btn:hover{ border-color: var(--mint-bright); }

  body.tv .edit-toggle, body.tv .edit-overlay, body.tv .edit-panel{ display:none !important; }

  body.tv, html.tv{
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  body.tv{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  body.tv .leaf-field{ display:none; }

  #tv-stage{
    display:none;
    width: 100vw;
    height: 100vh;
    position:fixed;
    top:0; left:0;
    flex-direction:column;
    background: radial-gradient(120% 140% at 12% -10%, var(--bg-1) 0%, var(--bg-0) 55%, #06120f 100%);
  }
  body.tv{ overflow:hidden; }
  body.tv #tv-stage{ display:flex; }
  body.tv > header, body.tv > main, body.tv > footer{ display:none; }

  #tv-stage .t-header{
    flex-shrink:0;
    text-align:center;
    padding: clamp(16px,3vh,40px) 20px clamp(10px,2vh,20px);
  }
  #tv-stage .t-logo{
    width: min(220px, 18vw);
    height: auto;
    margin: 0 auto;
    display:block;
    filter: drop-shadow(0 8px 20px var(--shadow));
  }

  #tv-stage .t-main-wrap{
    flex: 1 1 auto;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding: 0 30px;
  }
  #tv-stage .t-main{
    width: 100%;
    flex-shrink:0;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 3.125em;
    font-size: 16px;
  }
  #tv-stage .t-col{ display:flex; flex-direction:column; gap: 2.5em; padding-top: 1.375em; }

  #tv-stage .t-footer{
    flex-shrink:0;
    padding: clamp(10px,2vh,20px) 20px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 18px; letter-spacing:1.5px; color: var(--gold);
  }

  #tv-stage .category{ margin-top:0; }
  #tv-stage .ribbon{ font-size:1.625em; padding:0.8125em 2.375em; }
  #tv-stage .ribbon::after{ font-size:0.75em; margin-top:0.1875em; }
  #tv-stage .rows{ padding: 0.625em 1.25em 0.9375em; }
  #tv-stage .price-table thead th{ font-size:0.9375em; padding:0.625em 0.375em 0.6875em; }
  #tv-stage .price-table tbody td{ padding:0.875em 0.3125em; }
  #tv-stage .thc{ font-size:1em; }
  #tv-stage .pname{ font-size:1.3125em; }
  #tv-stage .price{ font-size:1.125em; }
  #tv-stage .badge-free{ font-size:0.9375em; padding: 0.375em 0.8125em; }
  #tv-stage .badge-highlight{ font-size:1.125em; padding: 0.4375em 0.9375em; }
</style>
</head>
<body>

<div class="leaf-field"></div>

<button class="edit-toggle" id="edit-toggle-btn">✎ Bewerken</button>
<div class="edit-overlay" id="edit-overlay"></div>
<div class="edit-panel" id="edit-panel">
  <button class="edit-close" id="edit-close-btn">✕ Sluiten</button>
  <h2>Menu bewerken</h2>
  <div class="edit-hint">
    Wijzigingen worden direct opgeslagen op dit apparaat. Gebruik "Exporteren"
    om ze over te zetten naar een ander scherm, en "Importeren" om ze daar te laden.
  </div>
  <div class="edit-toolbar">
    <button id="export-btn">⬇ Exporteren</button>
    <button id="import-btn">⬆ Importeren</button>
    <input type="file" id="import-file" accept="application/json" style="display:none">
    <button class="danger" id="reset-btn">↺ Standaard herstellen</button>
  </div>
  <div id="edit-form"></div>
</div>

};

const STORAGE_KEY = "cgg-menu-data-v1";

function loadMenu(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      if (parsed && parsed.columns) return parsed;
    }
  }catch(e){ console.warn("Kon opgeslagen menu niet lezen, standaard gebruikt.", e); }
  return JSON.parse(JSON.stringify(DEFAULT_MENU));
}

let MENU = loadMenu();

function saveMenu(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(MENU)); }
  catch(e){ console.warn("Opslaan mislukt", e); }
}

function fmt(n){
  if (n === undefined || n === null) return "";
  return Number.isInteger(n) ? n.toString() : n.toFixed(1).replace(/\.0$/,"");
}

function renderCategory(cat){
  const el = document.createElement("div");
  el.className = "category";
  el.style.setProperty("--accent", cat.accent || "var(--mint)");
  el.style.setProperty("--accent-2", cat.accent2 || "#2f8f74");

  const wrap = document.createElement("div");
  wrap.className = "ribbon-wrap";
  const ribbon = document.createElement("div");
  ribbon.className = "ribbon";
  ribbon.textContent = (cat.icon ? cat.icon + "  " : "") + cat.name;
  if (cat.sub) ribbon.setAttribute("data-sub", cat.sub);
  wrap.appendChild(ribbon);
  el.appendChild(wrap);

  const rows = document.createElement("div");
  rows.className = "rows";

  if (cat.perGramOnly){
    const table = document.createElement("table");
    table.className = "price-table";
    table.innerHTML = `
      <colgroup>
        <col class="col-thc"><col class="col-name"><col>
      </colgroup>
      <thead>
        <tr>
          <th class="th-thc">THC</th>
          <th class="th-name"></th>
          <th class="th-gram-last">Prijs</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;
    const tbody = table.querySelector("tbody");
    cat.items.forEach(item => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="thc">${item.thc}</td>
        <td class="pname${item.soldOut ? ' sold-out' : ''}"><span class="pname-main">${item.name}</span>${item.soldOut ? '<span class="pname-soldout-tag">Uitverkocht</span>' : ''}${item.sub ? `<br><span class="pname-sub">${item.sub}</span>` : ""}</td>
        <td class="price perg">${fmt(item.perGram)}<span class="unit">per gram</span></td>
      `;
      tbody.appendChild(tr);
    });
    rows.appendChild(table);
  } else {
    const table = document.createElement("table");
    table.className = "price-table";
    const gramHeads = cat.headerCols.slice(0,4).map(c=>`<th>${c}g</th>`).join("");
    table.innerHTML = `
      <colgroup>
        <col class="col-thc"><col class="col-name">
        <col class="col-gram"><col class="col-gram"><col class="col-gram"><col class="col-gram"><col class="col-gram">
      </colgroup>
      <thead>
        <tr>
          <th class="th-thc">THC</th>
          <th class="th-name"></th>
          ${gramHeads}
          <th class="th-gram-last">${cat.headerCols[4]}</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;
    const tbody = table.querySelector("tbody");
    cat.items.forEach(item => {
      const tr = document.createElement("tr");
      const priceCells = [0,1,2,3].map(i =>
        `<td class="price">${fmt(item.prices[i])}</td>`
      ).join("");
      const lastCell = item.free1g
        ? `<td class="price"><span class="badge-free">+1g GRATIS</span></td>`
        : (item.highlightLast
            ? `<td class="price"><span class="badge-highlight">${fmt(item.prices[4])}</span></td>`
            : `<td class="price">${fmt(item.prices[4])}</td>`);
      tr.innerHTML = `
        <td class="thc">${item.thc}</td>
        <td class="pname${item.soldOut ? ' sold-out' : ''}"><span class="pname-main">${item.name}${item.star ? ' <span class="star">*</span>' : ''}</span>${item.soldOut ? '<span class="pname-soldout-tag">Uitverkocht</span>' : ''}${item.sub ? `<br><span class="pname-sub">${item.sub}</span>` : ""}</td>
        ${priceCells}${lastCell}
      `;
      tbody.appendChild(tr);
    });
    rows.appendChild(table);
  }

  el.appendChild(rows);
  return el;
}

  root.innerHTML = "";
  MENU.columns.forEach(colData => {
    const col = document.createElement("div");
    col.className = "col";
    colData.categories.forEach(cat => col.appendChild(renderCategory(cat)));
    root.appendChild(col);
  });

  const tvRoot = document.getElementById("tv-menu-root");
  tvRoot.innerHTML = "";
  MENU.columns.forEach(colData => {
    const col = document.createElement("div");
    col.className = "t-col";
    colData.categories.forEach(cat => col.appendChild(renderCategory(cat)));
    tvRoot.appendChild(col);
  });
}

/* ---- Bewerk-paneel: bouwt formuliervelden op uit MENU en
   schrijft wijzigingen direct terug (met live her-render). ---- */
function allCategories(){
  const list = [];
  MENU.columns.forEach(colData => colData.categories.forEach(cat => list.push(cat)));
  return list;
}

function buildEditForm(){
  const form = document.getElementById("edit-form");
  form.innerHTML = "";

  allCategories().forEach(cat => {
    const block = document.createElement("div");
    block.className = "edit-cat-block";
    block.style.setProperty("--accent-label", cat.accent || "var(--mint-bright)");

    const title = document.createElement("div");
    title.className = "edit-cat-title";
    title.textContent = cat.name;
    block.appendChild(title);

    cat.items.forEach((item, idx) => {
      block.appendChild(buildItemRow(cat, item, idx));
    });

    const addBtn = document.createElement("button");
    addBtn.className = "add-item-btn";
    addBtn.textContent = "+ Product toevoegen aan " + cat.name;
    addBtn.addEventListener("click", () => {
      if (cat.perGramOnly){
        cat.items.push({ thc:"", name:"Nieuw product", perGram: 10 });
      } else {
        cat.items.push({ thc:"", name:"Nieuw product", prices:[0,0,0,0,0] });
      }
      saveMenu(); renderAll(); buildEditForm();
    });
    block.appendChild(addBtn);

    form.appendChild(block);
  });
}

function buildItemRow(cat, item, idx){
  const row = document.createElement("div");
  row.className = "edit-item";

  const row2 = document.createElement("div");
  row2.className = "row2";
  row2.innerHTML = `
    <div><label>THC</label><input type="text" data-field="thc" value="${item.thc || ""}"></div>
    <div><label>Naam</label><input type="text" data-field="name" value="${item.name || ""}"></div>
  `;
  row.appendChild(row2);

  const subWrap = document.createElement("div");
  subWrap.innerHTML = `<label>Subtekst (optioneel, onder de naam)</label><input type="text" data-field="sub" value="${item.sub || ""}">`;
  row.appendChild(subWrap);

  if (cat.perGramOnly){
    const priceWrap = document.createElement("div");
    priceWrap.innerHTML = `<label>Prijs per gram (€)</label><input type="number" step="0.5" data-field="perGram" value="${item.perGram || 0}">`;
    row.appendChild(priceWrap);
  } else {
    const row5 = document.createElement("div");
    row5.className = "row5";
    [0,1,2,3,4].forEach(i => {
      const cell = document.createElement("div");
      cell.innerHTML = `<label>${i+1}g</label><input type="number" step="0.5" data-price-idx="${i}" value="${(item.prices && item.prices[i]) || 0}">`;
      row5.appendChild(cell);
    });
    row.appendChild(row5);

    const flags = document.createElement("div");
    flags.className = "flags";
    flags.innerHTML = `
      <label><input type="checkbox" data-field="star" ${item.star ? "checked" : ""}> Vanaf-5-euro (*)</label>
      <label><input type="checkbox" data-field="free1g" ${item.free1g ? "checked" : ""}> +1g gratis i.p.v. 5g-prijs</label>
      <label><input type="checkbox" data-field="highlightLast" ${item.highlightLast ? "checked" : ""}> 5g-prijs uitlichten (gouden badge)</label>
      <label><input type="checkbox" data-field="soldOut" ${item.soldOut ? "checked" : ""}> Tijdelijk uitverkocht (rode streep)</label>
    `;
    row.appendChild(flags);
  }

  row.querySelectorAll('[data-field="thc"], [data-field="name"], [data-field="sub"]').forEach(inp => {
    inp.addEventListener("input", () => {
      item[inp.dataset.field] = inp.value;
      saveMenu(); renderAll();
    });
  });
  row.querySelectorAll('[data-field="perGram"]').forEach(inp => {
    inp.addEventListener("input", () => {
      item.perGram = parseFloat(inp.value) || 0;
      saveMenu(); renderAll();
    });
  });
  row.querySelectorAll('[data-price-idx]').forEach(inp => {
    inp.addEventListener("input", () => {
      if (!item.prices) item.prices = [0,0,0,0,0];
      item.prices[parseInt(inp.dataset.priceIdx)] = parseFloat(inp.value) || 0;
      saveMenu(); renderAll();
    });
  });
  row.querySelectorAll('[data-field="star"], [data-field="free1g"], [data-field="highlightLast"], [data-field="soldOut"]').forEach(inp => {
    inp.addEventListener("change", () => {
      item[inp.dataset.field] = inp.checked;
      saveMenu(); renderAll();
    });
  });

  const removeBtn = document.createElement("button");
  removeBtn.className = "remove-item";
  removeBtn.textContent = "✕ Product verwijderen";
  removeBtn.addEventListener("click", () => {
    cat.items.splice(idx, 1);
    saveMenu(); renderAll(); buildEditForm();
  });
  row.appendChild(removeBtn);

  return row;
}

renderAll();

const editToggleBtn = document.getElementById("edit-toggle-btn");
const editCloseBtn = document.getElementById("edit-close-btn");
const editOverlay = document.getElementById("edit-overlay");

function openEditor(){ document.body.classList.add("editing"); buildEditForm(); }
function closeEditor(){ document.body.classList.remove("editing"); }

editToggleBtn.addEventListener("click", openEditor);
editCloseBtn.addEventListener("click", closeEditor);
editOverlay.addEventListener("click", closeEditor);

document.getElementById("export-btn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(MENU, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "cgg-menu.json";
  a.click();
  URL.revokeObjectURL(url);
});

const importFileInput = document.getElementById("import-file");
document.getElementById("import-btn").addEventListener("click", () => importFileInput.click());
importFileInput.addEventListener("change", () => {
  const file = importFileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if (!parsed || !parsed.columns) throw new Error("Ongeldig bestand");
      MENU = parsed;
      saveMenu(); renderAll(); buildEditForm();
    }catch(e){
      alert("Dit bestand kon niet worden gelezen. Gebruik een JSON-bestand dat via 'Exporteren' is gemaakt.");
    }
  };
  reader.readAsText(file);
  importFileInput.value = "";
});

document.getElementById("reset-btn").addEventListener("click", () => {
  if (!confirm("Weet je zeker dat je terug wilt naar het standaardmenu? Eigen wijzigingen op dit apparaat gaan dan verloren.")) return;
  MENU = JSON.parse(JSON.stringify(DEFAULT_MENU));
  saveMenu(); renderAll(); buildEditForm();
});

var __qsMatch = location.search.match(/[?&]tv=1(&|$)/);
if (__qsMatch){
  document.body.classList.add("tv");

  var editToggleForTV = document.getElementById("edit-toggle-btn");
  if (editToggleForTV) editToggleForTV.style.display = "none";

  const tvMain = document.getElementById("tv-menu-root");
  function fitTvContent(){
    if (!tvMain) return;
    const wrap = tvMain.parentElement;
    const availH = wrap.clientHeight;
    if (availH === 0) return;
    let lo = 8, hi = 30, best = lo;
    for (let i = 0; i < 10; i++){
      const mid = (lo + hi) / 2;
      tvMain.style.fontSize = mid + "px";
      const h = tvMain.scrollHeight;
      if (h <= availH){ best = mid; lo = mid; } else { hi = mid; }
    }
    tvMain.style.fontSize = best + "px";
  }
  const origRenderAllForTV = renderAll;
  renderAll = function(){
    origRenderAllForTV();
    fitTvContent();
    setTimeout(fitTvContent, 60);
  };
  fitTvContent();
  setTimeout(fitTvContent, 60);
  setTimeout(fitTvContent, 400);
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(fitTvContent);
  }
  window.addEventListener("resize", fitTvContent);
  window.addEventListener("orientationchange", () => setTimeout(fitTvContent, 200));

  function tryFullscreen(){
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req){
      try { req.call(el); } catch(e){}
    }
    setTimeout(fitTvContent, 300);
  }
  document.body.addEventListener("click", tryFullscreen);
  document.body.addEventListener("keydown", tryFullscreen);
  document.addEventListener("fullscreenchange", () => setTimeout(fitTvContent, 200));
}

/* ---- Live koppeling met Google Sheet ("Product" / "Op" kolommen) ----
   Haalt periodiek de gepubliceerde CSV op en zet soldOut aan/uit op
   basis van de "Op" kolom (Ja = uitverkocht/rode streep). Matcht op
   productnaam, hoofdletterongevoelig. ---- */
var STOCK_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTiXNFs9DmYspqXd1gZjWpb0SiHzJHiiYWAtroM9VvNtQ2_qRE2MCyU90lP47BDqHWh29bblxcNarat/pub?output=csv";

function parseCSVBasic(text){
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim().length > 0; });
  return lines.map(function(line){
    var result = [];
    var cur = "";
    var inQuotes = false;
    for (var i = 0; i < line.length; i++){
      var ch = line[i];
      if (ch === '"'){
        inQuotes = !inQuotes;
      } else if (ch === "," && !inQuotes){
        result.push(cur); cur = "";
      } else {
        cur += ch;
      }
    }
    result.push(cur);
    return result;
  });
}

function normalizeProductName(s){
  return (s || "").toString().trim().toLowerCase();
}

function syncSoldOutFromSheet(){
  if (typeof fetch !== "function") return;
  fetch(STOCK_SHEET_CSV_URL, { cache: "no-store" })
    .then(function(res){ return res.text(); })
    .then(function(text){
      var rows = parseCSVBasic(text);
      if (rows.length < 2) return;
      var header = rows[0].map(normalizeProductName);
      var productIdx = header.indexOf("product");
      var opIdx = header.indexOf("op");
      if (productIdx === -1 || opIdx === -1) return;

      var statusMap = {};
      for (var i = 1; i < rows.length; i++){
        var row = rows[i];
        if (!row || row.length <= Math.max(productIdx, opIdx)) continue;
        var name = normalizeProductName(row[productIdx]);
        var opVal = normalizeProductName(row[opIdx]);
        if (!name) continue;
        statusMap[name] = (opVal === "ja" || opVal === "yes" || opVal === "true" || opVal === "1");
      }

      var changed = false;
      allCategories().forEach(function(cat){
        cat.items.forEach(function(item){
          var key = normalizeProductName(item.name);
          if (Object.prototype.hasOwnProperty.call(statusMap, key)){
            var val = statusMap[key];
            if (item.soldOut !== val){ item.soldOut = val; changed = true; }
          }
        });
      });

      if (changed){
        saveMenu();
        renderAll();
        if (document.body.classList.contains("editing")) buildEditForm();
      }
    })
    .catch(function(err){ console.warn("Kon voorraadstatus niet ophalen van Google Sheet:", err); });
}

syncSoldOutFromSheet();
setInterval(syncSoldOutFromSheet, 2 * 60 * 1000);
